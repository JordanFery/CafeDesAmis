services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cafedesamis
    ports:
      - "5432:5432"
    volumes:
      - cafedesamis_pgdata:/var/lib/postgresql/data

volumes:
  cafedesamis_pgdata:
